[workspace]
members = [
    "crates/core",
    "crates/android-ffi",
    "crates/broker-protocol",
    "crates/broker-auth",
    "crates/broker-exec",
    "crates/broker-process",
    "crates/broker-ipc",
    "crates/broker-android",
    "crates/broker-core",
    "crates/broker-client",
    "crates/broker-server",
    "crates/broker-wireless",
]
resolver = "2"

[workspace.package]
version = "2.1.5"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/LianXia233/android-privilege-broker"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
jni = { version = "0.21", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "process", "fs", "signal"] }
libc = "0.2"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
aes-gcm = "0.11.1"
curve25519-dalek = "5.0.0"
rcgen = "0.14.10"
rsa = "0.9.10"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "tls12", "std", "logging"] }
broker-wireless = { path = "crates/broker-wireless" }
broker-protocol = { path = "crates/broker-protocol" }
broker-auth = { path = "crates/broker-auth" }
broker-exec = { path = "crates/broker-exec" }
broker-process = { path = "crates/broker-process" }
broker-ipc = { path = "crates/broker-ipc" }
broker-android = { path = "crates/broker-android" }
broker-core = { path = "crates/broker-core" }
broker-client = { path = "crates/broker-client" }
broker-server = { path = "crates/broker-server" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
